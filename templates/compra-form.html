<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GdI - Formulario de Compra {% endblock %}</title>
    <!-- Verifiquen que esté cambiado a Jinja--> 
    <link rel="stylesheet" th:href="@{{url_for('static', filename='css/estilo.css')}}">
    <!-- Conservar el Bootstrap?
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    --> 
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-5">
        <h2 class="mb-4">Registrar Nueva Compra</h2>
        <form th:action="@{/compras/guardar}" th:object="${compra}" method="post" class="card p-4 shadow-sm">           
            <input type="hidden" th:field="*{id}" />
            <label class="form-label mt-2">Cliente (Usuario)</label>
            <select th:field="*{cliente.id}" class="form-select" required>
                <option value="">-- Seleccione un Cliente --</option>
                <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombre + ' ' + u.apellido}"></option>
            </select>

            <label class="form-label mt-3">Artículo</label>
            <select th:field="*{articulo.id}" class="form-select" required>
                <option value="">Clasificación de Artículo</option>
                <option th:each="art : ${articulos}" th:value="${art.id}" th:text="${art.titulo + ' ($' + art.precio + ')'}"></option>
            </select>

            <label class="form-label mt-3">Cantidad de artículos</label>
            <input th:field="*{cantidad}" type="number" class="form-control" min="1" required>

            <label class="form-label font-weight-bold">Promoción Aplicable</label>
            <select class="form-select" th:field="*{promocion.id}">
                <option value="">Vacío</option>
                <option th:each="p : ${promociones}" 
                        th:value="${p.id}" 
                        th:text="${p.nombre + ' (' + p.porcentaje + '%)'}">
                </option>
            </select>

            <label class="form-label mt-3">Monto total pagado ($)</label>
            <input th:field="*{pago}" type="number" step="0.01" class="form-control" min="0" readonly>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Guardar Compra</button>
                <a th:href="@{/compras}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
