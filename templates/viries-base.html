<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Viries{% endblock %} · Librería multimedia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/viries.css') }}">
</head>
<body>
    <a class="visually-hidden-focusable skip-link" href="#contenido">Saltar al contenido</a>
    {% include 'fragments/navbar.html' %}
    <main id="contenido" class="shell {% block layout %}{% endblock %}">
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="alert alert-{{ category or 'info' }}" role="status">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
    {% include 'fragments/footer.html' %}
</body>
</html>
