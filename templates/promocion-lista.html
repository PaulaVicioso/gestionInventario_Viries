<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GdI - Lista de Promociones {% endblock %}</title>
    <!-- Verifiquen que esté cambiado a Jinja--> 
    <link rel="stylesheet" th:href="@{{url_for('static', filename='css/estilo.css')}}">
    <!-- Conservar el Bootstrap?
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    --> 
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container mt-5">
        <h2>Listado de promociones</h2>
        <a class="btn btn-warning" th:href="@{/promociones/nuevo}">Agregar promoción</a>
    <hr>
        <table class="table table-striped table-hover align-middle m-0" border="1">
            <tr class="table-success">
            <th>ID</th>
            <th>Nombre de la promoción</th>
            <th>Fecha de inicio</th>
            <th>Fecha de finalización</th>
            <th>Porcentaje</th>
            <th>Acciones</th>
        </tr>

        <tr th:each="p : ${promociones}">
            <td th:text="${p.id}"></td>
            <td class="fw-bold" th:text="${p.nombre}"></td>
            <td th:text="${p.inicio}"></td>
            <td th:text="${p.fin}"></td>
            <td class="text-success fw-bold" th:text="${p.porcentaje + '%'}"></td>
            <td>
                <a class="btn btn-primary" th:href="@{/promociones/editar/{id}(id=${p.id})}">Editar</a>
                <a class="btn btn-danger" th:href="@{/promociones/eliminar/{id}(id=${p.id})}">Eliminar</a>
            </td>
        </tr>
        </table>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
