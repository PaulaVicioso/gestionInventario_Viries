<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GdI - Lista de artículos {% endblock %}</title>
    <!-- Verifiquen que esté cambiado a Jinja--> 
    <link rel="stylesheet" th:href="@{{url_for('static', filename='css/estilo.css')}}">
    <!-- Conservar el Bootstrap?
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    --> 
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-5">

        <h2>Listado de artículos</h2>
        <a class="btn btn-warning" th:href="@{/articulos/nuevo}">Dar de Alta artículo</a>
        <br>
        <hr>

        <table class="table table-striped align-middle">
            <thead class="table-primary">
                <tr>
                    <th scope="col">ID:</th>
                    <th scope="col">Imagen:</th>
                    <th scope="col">Título:</th>
                    <th scope="col">Stock:</th>
                    <th scope="col">Precio:</th>
                    <th scope="col">Promoción:</th>
                    <th scope="col">Modificar:</th>
                </tr>
            </thead>

        <tbody class="table-group-divider">
            <tr th:each="articulo : ${articulos}">
                <td th:text="${articulo.id}"></td>
                <td>
                        <img th:if="${articulo.imagen != null and !articulo.imagen.empty}" 
                             th:src="@{${articulo.imagen}}" 
                             alt="Portada" 
                             style="width: 45px; height: 45px; object-fit: cover; border-radius: 4px;" />
                        <span th:unless="${articulo.imagen != null and !articulo.imagen.empty}" class="text-muted small">Falta imagen</span>
                </td>
                <td class="fw-bold"  th:text="${articulo.titulo}"></td>
                <td th:text="${articulo.stock}"></td>
                <!-- <td th:text="${articulo.precio}"></td> -->
                <td class="text-success fw-bold" th:text="${'$' + #numbers.formatDecimal(articulo.precio, 1, 'POINT', 2, 'COMMA')}"></td>
                <td>
                <span class="text-info fw-bold" th:if="${articulo.promocion != null}" 
                    th:text="${articulo.promocion.porcentaje + '%'}">Promoción</span>                    
                <span th:unless="${articulo.promocion != null}" class="text-info">Sin promoción</span>
                <td>
                    <td>
                        <button type="button" class="btn btn-info btn-sm text-white" data-bs-toggle="modal" th:data-bs-target="'#modalDetalle' + ${articulo.id}">Ver</button>
                        <a class="btn btn-primary btn-sm" th:href="@{/articulos/editar/{id}(id=${articulo.id})}">Editar</a>
                        <a class="btn btn-danger btn-sm" th:href="@{/articulos/eliminar/{id}(id=${articulo.id})}" onclick="return confirm('¿Seguro que deseas dar de baja este artículo?');">Baja</a>

                        <div class="modal fade" th:id="'modalDetalle' + ${articulo.id}" tabindex="-1" aria-hidden="true">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-header bg-info text-white">
                                        <h5 class="modal-title">Detalles</h5>
                                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body text-start">
                                        <h4 th:text="${articulo.titulo}" class="mb-3 text-center text-primary"></h4>
                                        <ul class="list-group list-group-flush">
                                            <li class="list-group-item" th:if="${articulo instanceof T(com.example.model.Libro)}"><strong>Tipo:</strong> Libro</li>
                                            <li class="list-group-item" th:if="${articulo instanceof T(com.example.model.Cd)}"><strong>Tipo:</strong> CD</li>
                                            <li class="list-group-item" th:if="${articulo instanceof T(com.example.model.Pelicula)}"><strong>Tipo:</strong> Película</li>
                                            <li class="list-group-item"><strong>Autor:</strong> <span th:text="${articulo.autor}"></span></li>
                                            <li class="list-group-item"><strong>Idioma:</strong> <span th:text="${articulo.idioma}"></span></li>
                                            <li class="list-group-item"><strong>Clasificación:</strong> <span th:text="${articulo.clasificacion}"></span></li>
                                            <li class="list-group-item"><strong>Año:</strong> <span th:text="${articulo.anio}"></span></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                </td>
            </tr>
        </tbody>
    </table>
        </div>
        </div>

    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body> 
</html>
