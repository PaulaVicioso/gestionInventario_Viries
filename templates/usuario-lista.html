<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GdI - Lista de Usuarios {% endblock %}</title>
    <!-- Verifiquen que esté cambiado a Jinja--> 
    <link rel="stylesheet" th:href="@{{url_for('static', filename='css/estilo.css')}}">
    <!-- Conservar el Bootstrap?
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    --> 
</head>

    <body >
        <!-- Verifiquen que esté cambiado a Jinja--> 
        {% include 'fragments/navbar.html' %}      

        <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="m-0">Usuarios Registrados</h2>
            <div class="d-flex gap-2">
                <a th:href="@{{ url_for('lista_roles')}}" class="btn btn-info text-black shadow-sm">Roles</a>
                <a th:href="@{/permisos}" class="btn btn-success shadow-sm">Permisos</a>
                <a href="{{ url_for('usuarios.nuevo_usuario') }}" class="btn btn-warning shadow-sm">Alta Usuario</a>
            </div>
        </div>

        <div class="table-responsive bg-white rounded shadow-sm p-3">
            <table class="table table-striped table-hover align-middle m-0">
                <thead class="table-warning">
                <tr>
                    <th>ID:</th>
                    <th>Nombre:</th>
                    <th>Apellido:</th>
                    <th>Mail:</th>
                    <th>Rol asignado:</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                    {% for u in usuarios %}
                    <tr>
                        <td>{{u.id}}</td>
                        <td class="fw-bold">{{u.nombre}}</td>
                        <td>{{u.apellido}}</td>
                        <td>{{u.email}}</td>
                        <td>
                            <span class="text-info fw-bold" th:text="${u.rol.nombre}"></span>
                        </td>
                        <td class="text-center">
                            <div>
                                <a href="{{ url_for('usuarios.editar_usuario', usuario_id=u.id) }}" class="btn btn-primary text-white">Editar</a>
                                <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="btn btn-danger" 
                                onclick="return confirm('¿Seguro que deseas eliminar este usuario?');">Eliminar</a>
                            </div>
                        </td>
                    </tr>
                </tbody> 
            </table>
        </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
