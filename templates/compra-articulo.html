<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GdI - Compra cliente {% endblock %}</title>
    <!-- Verifiquen que esté cambiado a Jinja--> 
    <link rel="stylesheet" th:href="@{{url_for('static', filename='css/estilo.css')}}">
    <!-- Conservar el Bootstrap?
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    --> 
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="club">

        <div class="container mt-5">
            
            <h2 class="alert alert-danger">Artículos en venta</h2>
            
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
    </div>
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${exito}"></span>
    </div>

    <section class="card mb-4" style="width: 22rem;">
        <div class="card-header bg-success text-white fw-bold text-center">Carrito de compras</div>
    <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="item : ${carrito}">
            <div>
                <span th:text="${item.articulo.titulo}" class="fw-bold"></span>
                <span class="badge bg-info text-white rounded-pill ms-1" th:text="'x' + ${item.cantidad}"></span>
                <br>
                <small th:classappend="${item.estado == 'CONCRETADA' ? 'fw-bold text-success' : (item.estado == 'RECHAZADA' ? 'fw-bold text-danger' : 'text-warning fw-bold')}"
                       th:text="${item.estado}">
                </small>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="fw-bold text-dark" th:text="${'$' + #numbers.formatDecimal(item.pago, 1, 'POINT', 2, 'COMMA')}"></span>
                        
                <form th:action="@{/articulos/carrito/eliminar/{id}(id=${item.id})}" method="post" class="d-inline">
                <button type="submit" 
                        class="badge bg-danger rounded-pill border-0" 
                        title="Eliminar artículo"
                        onclick="return confirm('¿Sacar artículo del carrito?');">
                        &times;
                    </button>
                </form>
            </div>
        </li>
        <li class="list-group-item text-center text-muted" th:if="${#lists.isEmpty(carrito)}">
            Carrito vacío.
        </li>
    </ul>
    <div class="card-footer bg-dark text-white d-flex justify-content-between align-items-center fw-bold">
        <span>Precio total:</span>
        <span class="text-success" th:text="${'$' + #numbers.formatDecimal(precioTotal != null ? precioTotal : 0, 1, 'POINT', 2, 'COMMA')}"></span>
    </div>
</section>
<br>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
    <div class="col" th:each="articulo : ${articulos}">
        <div class="card h-100 shadow-sm border-0">
            
            <img th:if="${articulo.imagen != null and !articulo.imagen.empty}" th:src="@{${articulo.imagen}}" class="card-img-top" alt="Portada" style="height: 250px; object-fit: cover;" />
            
            <div th:unless="${articulo.imagen != null and !articulo.imagen.empty}" class="card-img-top bg-secondary bg-opacity-25 d-flex align-items-center justify-content-center text-muted" style="height: 250px;">
                <span><small>Falta imagen</small></span>
                </div>

                <div class="card-body d-flex flex-column">
                    <article class="alert alert-info">
                        <h5 class="card-title fw-bold" th:text="${articulo.titulo}">Título</h5>
                        <h6 class="fw-bold text-info" th:text="${articulo.autor}">Autor</h6>
                    </article>
                    
                    <div class="mt-auto">
                        <p class="card-text mb-1 small">
                            <strong>Clasificación:</strong> <span th:text="${articulo.clasificacion}"></span><br>
                            <strong>Idioma:</strong> <span th:text="${articulo.idioma}"></span> | 
                            <strong>Año:</strong> <span th:text="${articulo.anio}"></span><br>
                            <strong>Stock:</strong> <span th:text="${articulo.stock}"></span>
                        </p>
                            
                        <article class="card-header">
                            <h6 class="fw-bold text-success" th:text="${'$' + #numbers.formatDecimal(articulo.precio, 1, 'POINT', 2, 'COMMA')}"></h6> 
                            <span th:if="${articulo.promocion != null}" class="fw-bold text-info mb-2" 
                            th:text="${articulo.promocion.nombre + ' (' + articulo.promocion.porcentaje + '%)'}">
                        </span>
                    </article>
                </div>
            </div>
            
            <div class="card-footer bg-white border-top-0 d-flex justify-content-between pb-3">
                <a class="btn btn-warning btn-sm w-100 me-2" th:href="@{/articulos/comprar/{id}(id=${articulo.id})}">Comprar</a>
            </div>
            
        </div>
    </div>
</div>

</div>
<br>
<div th:replace="~{fragments/footer :: footer}"></div>
</main>
</body>
</html>
