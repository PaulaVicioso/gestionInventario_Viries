<!--
ADMINISTRADOR es el encargado del ingreso de los Usuarios, Artículo, Precios y Promociones
CAJERO tiene el control de los pagos y entrega de artículos.
CLIENTE puede ver, comprar con o sin promociones.
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <title>Navbar</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

    <body>
        <nav th:fragment="navbar" class="navbar navbar-dark bg-primary shadow-sm mb-0 py-2">
            <div class="container-fluid flex-wrap flex-sm-nowrap">
                <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-info" th:href="@{/}">
                    <img th:src="@{/imagenes/logoLibreria.png}" alt="Logo" width="30" height="30" class="d-inline-block align-text-top rounded">
                    <span>Libreria Multimedia</span>
                </a>
                    
                <div class="d-flex justify-content-center align-items-center mx-auto" id="navbarNav">
                    <ul class="navbar-nav flex-row gap-3 mb-0 p-0">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">Inicio</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                            <a class="nav-link" th:href="@{/articulos/catalogo}">Comprar</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('CAJERO')">
                            <a class="nav-link" th:href="@{/compras}">Registro</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                            <a class="nav-link" th:href="@{/promociones}">Promociones</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                            <a class="nav-link" href="{{ url_for('productos.listaProductos') }}">Artículos</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                            <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                        </li>
                    </ul>
                </div>

                <section class="d-flex align-items-center ms-auto">
                    <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-warning btn-sm text-danger fw-semibold">Iniciar Sesión</a>
                    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="text-warning btn btn-danger btn-sm">Cerrar sesión</button>
                    </form>
                </section>
            </div>
        </nav>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
