<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestión de inventario - Login {% endblock %}</title>
    <!-- Verifiquen que esté cambiado a Jinja--> 
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
    <!-- Conservar el Bootstrap?--> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    
    <body >
        <!-- Verifiquen que esté cambiado a Jinja--> 
        {% include 'fragments/navbar.html' %}        
            <main class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center py-4">

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category if category else 'info' }}" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            <h2>Formulario de Usuario</h2>
            <section class="card text-bg-danger shadow" style="width: 100%; max-width: 22rem;">
                <div class="card-body p-4">
                    <form action="{{ url_for('login') }}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email:</label>
                            <input type="text" name="username" class="form-control" required/>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Contraseña:</label>
                            <input type="password" name="password" class="form-control" required/>
                        </div>
                        
                        <div class="d-grid mt-4">
                            <button class="btn btn-warning fw-bold" type="submit">Iniciar</button>
                        </div>
                    </form>                 
                </div>
            </section>
            </main>
    
        {% include 'fragments/footer.html' %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
