{% extends 'viries-base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block layout %}narrow{% endblock %}
{% block content %}
<h1>Iniciar sesión</h1>
<form action="{{ url_for('login') }}" method="post" class="paper">
    <div class="mb-3">
        <label class="form-label" for="username">Correo electrónico</label>
        <input type="text" id="username" name="username" class="form-control" autocomplete="username" inputmode="email" required>
    </div>
    <div class="mb-4">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">Iniciar sesión</button>
</form>
<p class="mt-3">¿Todavía no tenés cuenta? <a href="{{ url_for('usuarios.nuevo_usuario') }}">Registrate</a>.</p>
{% endblock %}
