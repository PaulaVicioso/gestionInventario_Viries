<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GdI - Lista de permisos {% endblock %}</title>
    <!-- Verifiquen que esté cambiado a Jinja--> 
    <link rel="stylesheet" th:href="@{{url_for('static', filename='css/estilo.css')}}">
    <!-- Conservar el Bootstrap?
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    --> 
</head>

    <body>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <section class="container mt-5">

            <h2>Permisos</h2>
            <a class="btn btn-warning" th:href="@{/permisos/nuevo}">Agregar Permiso</a>
            <hr>
        <table class="table table-striped align-middle">
            <thead class="table-success">
                <tr>
                    <th>Id</th>
                    <th>Codigo</th>
                    <th>Descripcion</th>
                    <th>Padre</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="permiso: ${permisos}">
                    <td th:text="${permiso.id}"></td>
                    <td th:text="${permiso.codigo}"></td>
                    <td th:text="${permiso.descripcion}"></td>
                    <td th:text="${permiso.padre != null ? permiso.padre.codigo : 'Sin padre'}"></td>
                    <td>
                        <a class="btn btn-primary" th:href="@{/permisos/editar/{id}(id=${permiso.id})}">Editar</a>
                        <a class="btn btn-danger" th:href="@{/permisos/eliminar/{id}(id=${permiso.id})}">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
        </section>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
