<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GdI - Lista de Roles {% endblock %}</title>
    <!-- Verifiquen que esté cambiado a Jinja--> 
    <link rel="stylesheet" th:href="@{{url_for('static', filename='css/estilo.css')}}">
    <!-- Conservar el Bootstrap?
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    --> 
</head>

    <body>
        <!-- Verifiquen que esté cambiado a Jinja--> 
        {% include 'fragments/navbar.html' %}
        <section class="container mt-5">
            <h2>Lista de Roles</h2>
            <a class="btn btn-warning" th:href="@{/roles/nuevo}">Agregar Rol</a>
            <hr>
        <table class="table table-striped table-hover align-middle m-0">
            <thead class="table-info">
                <tr>
                    <th>Id</th>
                    <th>Nombre</th>
                    <th>Permiso</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="rol : ${roles}">
                    <td th:text="${rol.id}"></td>
                    <td th:text="${rol.nombre}"></td>
                    <td>
                        <span th:if="${#lists.isEmpty(rol.permisos)}" class="text-muted fst-italic">Vacío</span>
                        <span th:each="permiso : ${rol.permisos}" 
                            class="text-success fw-bold me-1" 
                            th:text="${permiso.codigo}">
                        </span>
                    </td>
                    <td>
                        <a th:href="@{/roles/editar/{id}(id=${rol.id})}" class="btn btn-sm btn-primary">Editar</a>
                        <a th:href="@{/roles/eliminar/{id}(id=${rol.id})}" class="btn btn-sm btn-danger">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
        </section>
        <br>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
