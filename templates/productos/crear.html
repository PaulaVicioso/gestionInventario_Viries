<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GdI - Alta de producto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="mb-3">Alta de producto</h2>

        {% with mensajes = get_flashed_messages() %}
            {% for m in mensajes %}
                <div class="alert alert-danger" role="alert">{{ m }}</div>
            {% endfor %}
        {% endwith %}

        <form method="post" action="{{ url_for('productos.crear') }}">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>

            <div class="mb-3">
                <label for="autor" class="form-label">Autor:</label>
                <input type="text" class="form-control" id="autor" name="autor" required>
            </div>

            <div class="mb-3">
                <label for="tipo_articulo" class="form-label">Tipo de artículo:</label>
                <select class="form-select" id="tipo_articulo" name="tipo_articulo" required>
                    <option value="Libro">Libro</option>
                    <option value="Música">Música</option>
                    <option value="Película">Película</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="genero" class="form-label">Género:</label>
                <input type="text" class="form-control" id="genero" name="genero" required>
            </div>

            <div class="mb-3">
                <label for="idioma" class="form-label">Idioma:</label>
                <input type="text" class="form-control" id="idioma" name="idioma" required>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="anio" class="form-label">Año:</label>
                    <input type="number" class="form-control" id="anio" name="anio" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="precio" class="form-label">Precio:</label>
                    <input type="number" class="form-control" id="precio" name="precio" step="0.01" min="0" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="stock" class="form-label">Stock:</label>
                    <input type="number" class="form-control" id="stock" name="stock" min="0" required>
                </div>
            </div>

            <fieldset class="row">
                <legend class="fs-6">Rango de edad recomendado</legend>
                <div class="col-md-6 mb-3">
                    <label for="edad_minima" class="form-label">Edad mínima (opcional)</label>
                    <input type="number" min="0" class="form-control" id="edad_minima" name="edad_minima" value="{{ request.form.get('edad_minima', '') }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="edad_maxima" class="form-label">Edad máxima (opcional)</label>
                    <input type="number" min="0" class="form-control" id="edad_maxima" name="edad_maxima" value="{{ request.form.get('edad_maxima', '') }}">
                </div>
            </fieldset>

            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-warning">Guardar</button>
                <a href="{{ url_for('productos.listaProductos') }}" class="btn btn-secondary" style="display: inline-block; text-align: center;">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
