<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GdI - Editar producto</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5" style="max-width: 600px;">

        <h2 class="mb-3">Editar producto</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category else 'info' }}" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post"
              action="{{ url_for('productos.editar', id_producto=producto.id_producto) }}">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>

                <input type="text"
                       class="form-control"
                       id="nombre"
                       name="nombre"
                       value="{{ producto.nombre }}"
                       required>
            </div>

            <div class="mb-3">
                <label for="autor" class="form-label">Autor:</label>

                <input type="text"
                       class="form-control"
                       id="autor"
                       name="autor"
                       value="{{ producto.autor }}"
                       required>
            </div>

            <div class="mb-3">
                <label for="tipo_articulo" class="form-label">Tipo de artículo:</label>

                <select class="form-select" id="tipo_articulo" name="tipo_articulo" required>

                    <option value="Libro"
                        {% if producto.tipo_articulo == "Libro" %}selected{% endif %}>
                        Libro
                    </option>

                    <option value="Música"
                        {% if producto.tipo_articulo == "Música" %}selected{% endif %}>
                        Música
                    </option>

                    <option value="Película"
                        {% if producto.tipo_articulo == "Película" %}selected{% endif %}>
                        Película
                    </option>

                </select>
            </div>

            <div class="mb-3">
                <label for="genero" class="form-label">Género:</label>

                <input type="text"
                       class="form-control"
                       id="genero"
                       name="genero"
                       value="{{ producto.genero }}"
                       required>
            </div>

            <div class="mb-3">
                <label for="idioma" class="form-label">Idioma:</label>

                <input type="text"
                       class="form-control"
                       id="idioma"
                       name="idioma"
                       value="{{ producto.idioma }}"
                       required>
            </div>

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label for="anio" class="form-label">Año:</label>

                    <input type="number"
                           class="form-control"
                           id="anio"
                           name="anio"
                           min="1"
                           value="{{ producto.anio }}"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label for="precio" class="form-label">Precio:</label>

                    <input type="number"
                           class="form-control"
                           id="precio"
                           name="precio"
                           step="0.01"
                           min="0"
                           value="{{ producto.precio }}"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label for="stock" class="form-label">Stock:</label>

                    <input type="number"
                           class="form-control"
                           id="stock"
                           name="stock"
                           min="0"
                           value="{{ producto.stock }}"
                           required>
                </div>

            </div>

            <fieldset class="row">
                <legend class="fs-6">Rango de edad recomendado</legend>
                <div class="col-md-6 mb-3">
                    <label for="edad_minima" class="form-label">Edad mínima (opcional)</label>
                    <input type="number" min="0" class="form-control" id="edad_minima" name="edad_minima" value="{{ request.form.get('edad_minima', producto.edad_minima if producto.edad_minima is not none else '') }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="edad_maxima" class="form-label">Edad máxima (opcional)</label>
                    <input type="number" min="0" class="form-control" id="edad_maxima" name="edad_maxima" value="{{ request.form.get('edad_maxima', producto.edad_maxima if producto.edad_maxima is not none else '') }}">
                </div>
            </fieldset>

            <div class="d-flex gap-2 mt-3">

                <button type="submit" class="btn btn-warning">
                    Actualizar
                </button>
                <a href="{{ url_for('productos.listaProductos') }}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </div>

        </form>
    </div>

</body>
</html>
