<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GdI - Formulario de permisos {% endblock %}</title>
    <!-- Verifiquen que esté cambiado a Jinja--> 
    <link rel="stylesheet" th:href="@{{url_for('static', filename='css/estilo.css')}}">
    <!-- Conservar el Bootstrap?
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    --> 
</head>

    <body>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <section style="max-width: 600px; margin: 30px auto; padding: 25px; border: 1px solid #ccc; border-radius: 8px; background-color: #ffffff;">
        
        <h2 class="mb-3">
            <span class="alert alert-success d-block text-center py-2" th:text="${permiso.id == null ? 'Crear Nuevo Permiso' : 'Editar Permiso'}">Formulario de Permisos</span>
        </h2>

        <p class="text-muted fs-6">
            Ingrese la clave única del permiso (código) y su descripción. Si este permiso depende jerárquicamente de otro permiso superior, selecciónelo en la opción <strong>Permiso Padre</strong>.
        </p>

        <form th:action="@{/permisos/guardar}" th:object="${permiso}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label for="codigo" class="form-label fw-bold">Código del Permiso:</label>
                <input type="text" id="codigo" class="form-control" th:field="*{codigo}" placeholder="Ej: USUARIOS_CREAR, PRODUCTOS_ELIMINAR" required/>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label fw-bold">Descripción:</label>
                <input type="text" id="descripcion" class="form-control" th:field="*{descripcion}" placeholder="Ej: Permite dar de alta nuevos usuarios"/>
            </div>

            <div class="mb-4">
                <label for="padre" class="form-label fw-bold">Permiso Padre (Opcional):</label>
                <select id="padre" th:field="*{padre.id}" class="form-select">
                    <option value="">-- Sin permiso padre (Permiso Principal) --</option>
                    <option th:each="permisoPadre : ${permisoPadre}"
                            th:value="${permisoPadre.id}"
                            th:text="${permisoPadre.codigo + ' (' + permisoPadre.descripcion + ')'}"
                            th:if="${permiso.id == null || permisoPadre.id != permiso.id}">
                    </option>
                </select>
                <div class="form-text">Si selecciona un permiso padre, este nuevo permiso actuará como una sub-acción del mismo.</div>
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-warning" type="submit">Guardar</button>
                <button class="btn btn-danger" th:href="@{/permisos}">Cancelar</button>
            </div>
        </form>
    </section>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
