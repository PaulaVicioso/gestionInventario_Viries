<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GdI - Formulario de promociones {% endblock %}</title>
    <!-- Verifiquen que esté cambiado a Jinja--> 
    <link rel="stylesheet" th:href="@{{url_for('static', filename='css/estilo.css')}}">
    <!-- Conservar el Bootstrap?
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    --> 
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm p-4 bg-white rounded">
    <h2 class="alert alert-success">Crear Promoción</h2>

        <form th:action="@{/promociones/guardar}" th:object="${promocion}" method="post">

            <input type="hidden" th:field="*{id}"/>
            <div class="mb-4">
                <label class="col-sm-2 col-form-label">Nombre:</label>
                <input type="text" th:field="*{nombre}"/>
            </div>
            <div class="mb-4">
                <label class="col-sm-2 col-form-label">Comienzo:</label>
                <input type="date" th:field="*{inicio}"/>
            </div>
            <div class="mb-4">
                <label class="col-sm-2 col-form-label">Finalización:</label>
                <input type="date" th:field="*{fin}"/>
            </div>
            <div class="mb-4">
                <label class="col-sm-2 col-form-label">Porcentaje:</label>
                <input type="number" step="0.01" th:field="*{porcentaje}"/>
            </div>
            <button class="btn btn-warning" type="submit">
                Guardar
            </button>
            <a th:href="@{/promociones}" class="btn btn-danger">Cancelar</a>

        </form>
    </div>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
