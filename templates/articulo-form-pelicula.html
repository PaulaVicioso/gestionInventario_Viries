<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestión de inventario - Película {% endblock %}</title>
    <!-- Verifiquen que esté cambiado a Jinja--> 
    <link rel="stylesheet" th:href="@{{url_for('static', filename='css/estilo.css')}}">
    <!-- Conservar el Bootstrap?
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    --> 
</head>

<body>
        <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div style="max-width: 600px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
        <h2 class="alert alert-warning">Registrar Película</h2>

        <form th:action="@{/articulos/guardar/pelicula}" th:object="${articulo}" method="post" enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}"/>

            <div>
                <label>Título</label>
                <input type="text" th:field="*{titulo}" required/>
            </div>

            <div>
                <label>Autor</label>
                <input type="text" th:field="*{autor}" required/>
            </div>

            <div>
                <label>Idioma</label>
                <input type="text" th:field="*{idioma}" required/>
            </div>            
            
            <div>
                <label>Año</label>
                <input type="number" th:field="*{anio}" required/>
            </div>
            
            <div>
                <label>Clasificación</label>
                <input type="text" th:field="*{clasificacion}"/>
            </div>

            <div>
                <label>Precio en pesos</label>
                <input type="number" step="0.01" th:field="*{precio}" required/>
            </div>
            
            <div>
                <label>Stock</label>
                <input type="number" th:field="*{stock}" required/>
            </div>

            <div>
                <label>Imagen</label>
                <input type="file" name="imagenArchivo" accept="image/*"/>
            </div>

            <hr>
            <div>
                <label>Formato</label>
                <input type="text" th:field="*{formato}" required/>
            </div>
            <div>
                <label>Duración (minutos)</label>
                <input type="number" th:field="*{duracion}" required/>
            </div>

            <div style="margin-top: 20px;">
                <button class="btn btn-warning" type="submit">Guardar</button>
                <a class="btn btn-danger" th:href="@{/articulos}">Cancelar</a>
            </div>          
        </form>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
