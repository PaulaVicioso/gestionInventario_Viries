services:
  - type: web
    name: viries
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: VIRIES_DB_PATH
        value: /tmp/viries-demo.db
